<div id="chat-widget">
  <div id="chat-box">
    <div id="chat-header">
      <button id="chat-back-btn" onclick="toggleChat()" aria-label="بستن چت">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <div id="chat-header-title">پشتیبان Rodi</div>
      <button id="chat-menu-btn" aria-label="منو">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>

    <div id="chat-messages">
      <div class="msg bot">
        <div class="msg-avatar bot">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M12 2C6.48 2 2 6.02 2 11c0 2.76 1.32 5.22 3.4 6.9L4 22l4.42-1.47A10 10 0 0012 21c5.52 0 10-4.02 10-9s-4.48-9-10-9z"/></svg>
        </div>
        <div class="msg-content">
          <div class="msg-bubble">سلام! 👋 من پشتیبان Rodi هستم. دربارهٔ نصب پنل خورشیدی چطور می‌تونم کمکتون کنم؟</div>
          <div class="msg-time" id="init-time"></div>
        </div>
      </div>
    </div>

    <div id="chat-suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion('پکیج‌های شما چیست؟')">پکیج‌ها</button>
      <button class="suggestion-chip" onclick="sendSuggestion('هزینه نصب چقدر است؟')">هزینه نصب</button>
      <button class="suggestion-chip" onclick="sendSuggestion('می‌خواهم بازدید رایگان')">بازدید رایگان</button>
    </div>

    <div id="n8n-config-bar">
      <div id="n8n-status-dot"></div>
      <label>آدرس n8n:</label>
      <input type="text" id="n8n-url-input" placeholder="https://your-n8n.com/webhook/xxx" dir="ltr" />
      <button onclick="saveN8nUrl()">ذخیره</button>
    </div>

    <div id="chat-footer">
      <div id="chat-form">
        <input type="text" id="chat-input" placeholder="پیام خود را بنویسید..." autocomplete="off" />
        <button id="chat-send" onclick="sendMessage()" aria-label="ارسال">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div id="chat-footer-note">اتصال اختیاری به n8n</div>
    </div>
  </div>

  <div id="chat-bubble" onclick="toggleChat()" role="button" aria-label="باز کردن چت">
    <div id="chat-badge">۱</div>
    <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </div>
</div>
