<section id="contact" class="py-20 px-container-padding bg-surface border-t border-outline-variant/20">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-12">
      <h2 class="font-display-xl text-[36px] md:text-[42px] leading-tight text-on-surface mb-4">تماس با ما</h2>
      <p class="text-on-surface-variant font-body-lg text-body-lg">سوال دارید؟ فرم را پر کنید یا از واتساپ پیام بدهید.</p>
    </div>
    <div class="bg-white/40 backdrop-blur-xl rounded-2xl border border-white/60 shadow-sm p-8 grid md:grid-cols-2 gap-8">
      <div class="flex flex-col gap-4">
        <div>
          <label class="block text-sm font-semibold text-on-surface mb-1.5">نام و نام خانوادگی</label>
          <input type="text" id="contact-name" placeholder="مثلاً علی رضایی" class="w-full bg-white/50 border border-white/60 rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-on-surface mb-1.5">شماره موبایل</label>
          <input type="tel" id="contact-phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" class="w-full bg-white/50 border border-white/60 rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" dir="ltr"/>
        </div>
        <div>
          <label class="block text-sm font-semibold text-on-surface mb-1.5">ایمیل (اختیاری)</label>
          <input type="email" id="contact-email" placeholder="name@example.com" class="w-full bg-white/50 border border-white/60 rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" dir="ltr"/>
        </div>
      </div>
      <div class="flex flex-col gap-4">
        <div class="flex-1">
          <label class="block text-sm font-semibold text-on-surface mb-1.5">پیام شما</label>
          <textarea id="contact-message" placeholder="نوع ملک، مصرف تقریبی برق، یا هر سوالی دارید..." rows="6" class="w-full bg-white/50 border border-white/60 rounded-xl px-4 py-3 text-on-surface placeholder:text-on-surface-variant/50 text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all resize-none"></textarea>
        </div>
        <button onclick="submitContact(this)" class="w-full bg-primary text-white font-semibold py-3.5 rounded-xl hover:bg-primary/90 transition-all shadow-sm flex items-center justify-center gap-2">
          <span>ارسال درخواست</span>
          <span class="material-symbols-outlined text-[18px] icon-rtl-flip">send</span>
        </button>
        <a id="contact-whatsapp-link" href="#" target="_blank" rel="noopener noreferrer" class="w-full bg-[#25D366]/10 border border-[#25D366]/30 text-green-800 font-semibold py-3 rounded-xl hover:bg-[#25D366]/20 transition-all flex items-center justify-center gap-2 text-sm">
          یا از طریق واتساپ پیام دهید
        </a>
      </div>
    </div>
  </div>
</section>
